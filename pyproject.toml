[project]
name = "inventario-visual"
version = "0.1.0"
description = "Servidor local que recebe vídeo da câmera do celular via WebRTC e salva frames-chave para processamento posterior."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiortc>=1.9",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "cryptography>=42",
]

[project.optional-dependencies]
# Etapa de visão (YOLO-World). Instale com:  uv sync --extra visao
visao = [
    "ultralytics>=8.3",
    # CLIP usado pelo YOLO-World para codificar os nomes das classes. Declarado
    # aqui para o ultralytics não tentar instalá-lo sozinho na primeira execução.
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]
# Descrição dos itens com modelo de visão-linguagem. Instale com:  uv sync --extra visao --extra vlm
vlm = [
    "transformers>=4.57",  # Qwen3-VL
    "accelerate>=1.0",
    "bitsandbytes>=0.45; sys_platform == 'linux' or sys_platform == 'win32'",  # quantização 4/8 bits
    "pillow>=10",
]

[project.scripts]
inventario-visual = "inventario_visual.__main__:main"
inventario-offline = "inventario_visual.offline:main"
inventario-descrever = "inventario_visual.vision.vlm:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/inventario_visual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["visao: testes que usam o YOLO-World real (precisam do extra 'visao')"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
